[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbtok"
dynamic = ["version", "dependencies"]
description = "Rule-based Arabic (MSA) text-to-IPA with tashkeel diacritization — an orthography2ipa G2P plugin"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = ["arabic", "ipa", "g2p", "phonemizer", "tashkeel", "diacritization", "tts"]

[tool.setuptools.dynamic]
version = {attr = "arbtok.version.VERSION_STR"}
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "jiwer"]

[project.entry-points."orthography2ipa.normalize"]
arbtok = "arbtok.o2i_plugins:ArbtokDiacritizer"

[project.entry-points."orthography2ipa.rescore"]
arbtok = "arbtok.o2i_plugins:ArbtokRescorers"

[project.entry-points."orthography2ipa.sandhi"]
arbtok = "arbtok.o2i_plugins:ArbtokSandhi"

[project.urls]
Homepage = "https://github.com/TigreGotico/arbtok"
Issues = "https://github.com/TigreGotico/arbtok/issues"

[tool.setuptools.packages.find]
include = ["arbtok*"]

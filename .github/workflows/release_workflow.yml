name: Release Alpha and Propose Stable

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish_alpha:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      branch: 'dev'
      version_file: 'arbtok/version.py'
      update_changelog: true
      publish_prerelease: true
      # arbtok has no stable branch and never has had one: `dev` is the trunk and the
      # alpha on PyPI is the release. The shared workflow's `base_branch` defaults to
      # `master`, so proposing a release asked git for a ref that does not exist and
      # the job died with `fatal: couldn't find remote ref master` on every merge.
      propose_release: false
      changelog_max_issues: 100
      publish_pypi: true
      notify_matrix: true
